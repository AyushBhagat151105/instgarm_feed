name: instgarm_feed

services:
  postgres:
    image: postgres
    container_name: instgarm_feed-postgres
    environment:
      POSTGRES_DB: instgarm_feed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - instgarm_feed_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  instgarm_feed_postgres_data:
