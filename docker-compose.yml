# Docker Compose for instgarm_feed
# Full-stack container orchestration

name: instgarm_feed

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: instgarm_feed-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://server:3001
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - instgarm_feed-network

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: instgarm_feed-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/instgarm_feed
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - instgarm_feed-network

  db:
    image: postgres:16-alpine
    container_name: instgarm_feed-postgres
    environment:
      POSTGRES_DB: instgarm_feed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - instgarm_feed_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - instgarm_feed-network

networks:
  instgarm_feed-network:
    driver: bridge

volumes:
  instgarm_feed_postgres_data:
